[tool.poetry]
name = "resilience4py"
version = "0.1.0"
description = "resilience4py is a port of resilience4j library"
authors = ["Dr. Nobel Khandaker <nobel@outlook.com>"]
readme = "README.md"
packages = [{include = "resilience4py", from = "src"}]

[tool.poetry.dependencies]
python = "^3.10"
pytest = "^8.2.2"
black = "^25.1.0"
isort = "^6.0.1"
flake8 = "^7.2.0"


[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
